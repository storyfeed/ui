name: Vue and React kits

on:
  push:
    paths:
      - 'composer.json'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'resources/js/**'
      - 'tests/Unit/**'
      - 'tests/Feature/InstallUiCommandTest.php'
      - 'tests/Fixtures/InstallKitsTest.php'
      - 'src/Commands/**'
      - 'src/UiServiceProvider.php'
      - 'workbench/**'
      - 'package*.json'
      - '.github/workflows/vue.yml'
  pull_request:
    paths:
      - 'composer.json'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'resources/js/**'
      - 'tests/Unit/**'
      - 'tests/Feature/InstallUiCommandTest.php'
      - 'tests/Fixtures/InstallKitsTest.php'
      - 'src/Commands/**'
      - 'src/UiServiceProvider.php'
      - 'workbench/**'
      - 'package*.json'
      - '.github/workflows/vue.yml'

jobs:
  vue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: npm ci
      - run: npm run test:vue
      - run: npm run test:react
      - run: npm run test:installed
      - run: npm run typecheck:react
      - run: npm run workbench
      - run: npx playwright install --with-deps chromium
      - run: npm run test:hydrate
      - run: npm run kit:parity
        env:
          STORYFEED_SCREENSHOTS: ${{ runner.temp }}/kit-parity
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: kit-parity
          path: ${{ runner.temp }}/kit-parity
